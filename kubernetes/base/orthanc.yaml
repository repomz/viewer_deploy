apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: viewer
spec:
  selector:
    app.kubernetes.io/name: orthanc
  ports:
    - name: http
      port: 8042
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc-dicom
  namespace: viewer
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: orthanc
  ports:
    - name: dicom
      port: 4242
      targetPort: dicom
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
  namespace: viewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orthanc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orthanc
        app.kubernetes.io/part-of: viewer
    spec:
      containers:
        - name: orthanc
          image: jodogne/orthanc-plugins:1.12.11
          args: [/etc/orthanc/]
          ports:
            - {name: http, containerPort: 8042}
            - {name: dicom, containerPort: 4242}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/orthanc/orthanc.json
              subPath: orthanc.json
              readOnly: true
            - name: data
              mountPath: /var/lib/orthanc/db
      volumes:
        - name: config
          secret:
            secretName: viewer-secrets
            items:
              - key: orthanc.json
                path: orthanc.json
        - name: data
          persistentVolumeClaim:
            claimName: orthanc-data

