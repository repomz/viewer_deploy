apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: viewer
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: viewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: viewer
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: [sh, -ec, "until pg_isready -h postgres -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: POSTGRES_USER}
        - name: migrations
          image: ghcr.io/repomz/viewer_backend-migrations:0.2.9
          args: [up]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: DB_DSN}
      containers:
        - name: backend
          image: ghcr.io/repomz/viewer_backend:0.2.9
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: viewer-config
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: DB_DSN}
            - name: REMOTE_PACS_USERNAME
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: REMOTE_PACS_USERNAME}
            - name: REMOTE_PACS_PASSWORD
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: REMOTE_PACS_PASSWORD}
            - name: YANDEX_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: YANDEX_ACCESS_KEY_ID}
            - name: YANDEX_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: YANDEX_SECRET_ACCESS_KEY}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: reports, mountPath: /app/reports}
            - {name: plans, mountPath: /app/plans}
            - {name: xa-cache, mountPath: /app/xa-cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: reports-data}
        - name: plans
          persistentVolumeClaim: {claimName: plans-data}
        - name: xa-cache
          persistentVolumeClaim: {claimName: xa-cache-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
