apiVersion: v1
kind: Secret
metadata:
  name: viewer-secrets
  namespace: viewer
type: Opaque
stringData:
  POSTGRES_DB: viewer
  POSTGRES_USER: viewer
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES
  DB_DSN: postgres://viewer:CHANGE_ME_POSTGRES@postgres:5432/viewer?sslmode=disable
  REMOTE_PACS_USERNAME: mapdr
  REMOTE_PACS_PASSWORD: CHANGE_ME_ORTHANC
  PACS_AUTHORIZATION: Basic CHANGE_ME_BASE64_MAPDR_COLON_PASSWORD
  YANDEX_ACCESS_KEY_ID: ""
  YANDEX_SECRET_ACCESS_KEY: ""
  orthanc.json: |
    {
      "Name": "M A P D R",
      "StorageDirectory": "/var/lib/orthanc/db",
      "IndexDirectory": "/var/lib/orthanc/db",
      "StorageCompression": true,
      "MaximumStorageSize": 0,
      "MaximumPatientCount": 0,
      "Plugins": ["/usr/local/share/orthanc/plugins/libOrthancDicomWeb.so"],
      "HttpServerEnabled": true,
      "OrthancExplorerEnabled": true,
      "HttpPort": 8042,
      "HttpCompressionEnabled": true,
      "DicomServerEnabled": true,
      "DicomAet": "MAPDR",
      "DicomCheckCalledAet": true,
      "DicomPort": 4242,
      "RemoteAccessAllowed": true,
      "AuthenticationEnabled": true,
      "RegisteredUsers": {"mapdr": "CHANGE_ME_ORTHANC"},
      "DicomAlwaysAllowEcho": true,
      "DicomAlwaysAllowStore": true,
      "DicomAlwaysAllowFind": false,
      "DicomAlwaysAllowGet": false,
      "DicomAlwaysAllowMove": false,
      "DicomCheckModalityHost": false,
      "DicomModalities": {
        "hospital-agent": ["HOSPITAL_AGENT", "agent", 11112],
        "radiant": {
          "AET": "RADIANT",
          "Host": "127.0.0.1",
          "Port": 11112,
          "Manufacturer": "Generic",
          "AllowEcho": true,
          "AllowFind": true,
          "AllowGet": true,
          "AllowMove": false,
          "AllowStore": false
        }
      },
      "DicomModalitiesInDatabase": false,
      "DicomScuTimeout": 30,
      "DicomThreadsCount": 2,
      "HttpTimeout": 60,
      "KeepAlive": true,
      "TcpNoDelay": true,
      "HttpThreadsCount": 12,
      "StoreDicom": true,
      "QueryRetrieveSize": 100,
      "CaseSensitivePN": false,
      "MetricsEnabled": true,
      "SaveJobs": true,
      "StorageAccessOnFind": "Always"
    }

