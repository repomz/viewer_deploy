apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: viewer
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: viewer
    spec:
      containers:
        - name: frontend
          image: ghcr.io/repomz/viewer_frontend:0.2.31
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: BACKEND_URL, value: "http://backend:8080"}
            - {name: PACS_URL, value: "http://orthanc:8042"}
            - name: PACS_AUTHORIZATION
              valueFrom:
                secretKeyRef: {name: viewer-secrets, key: PACS_AUTHORIZATION}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
