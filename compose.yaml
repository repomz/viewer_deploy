name: viewer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-viewer}
  POSTGRES_USER: ${POSTGRES_USER:-viewer}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  migrations:
    image: ${BACKEND_MIGRATIONS_IMAGE:-idrisovmarat/viewer_backend-migrations:0.2.0}
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks: [application]

  storage-init:
    image: alpine:3.22
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command:
      - sh
      - -ec
      - |
        chown 10001:10001 /app/reports /app/plans /app/xa-cache
        chmod 750 /app/reports /app/plans /app/xa-cache
    volumes:
      - reports-data:/app/reports
      - plans-data:/app/plans
      - xa-cache-data:/app/xa-cache
    restart: "no"

  pacs:
    image: jodogne/orthanc-plugins:1.12.11
    ports:
      - ${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ORTHANC_ADMIN_PORT:-8042}:8042
      - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${ORTHANC_DICOM_PORT:-4242}:4242
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --user=${ORTHANC_USERNAME:-mapdr} --password=${ORTHANC_PASSWORD} -O /dev/null http://127.0.0.1:8042/system"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [pacs]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/repomz/viewer_backend:0.2.8}
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable
      HTTP_ADDR: :8080
      TZ: ${TZ:-Asia/Tomsk}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      REPORT_AGENT_ID: ${REPORT_AGENT_ID:-2}
      PLANS_DIR: ${PLANS_DIR:-/app/plans}
      XA_CACHE_DIR: ${XA_CACHE_DIR:-/app/xa-cache}
      XA_CACHE_TIMEOUT_SECONDS: ${XA_CACHE_TIMEOUT_SECONDS:-120}
      XA_CACHE_FFMPEG_PATH: /usr/bin/ffmpeg
      XA_CACHE_STUDY_WORKERS: ${XA_CACHE_STUDY_WORKERS:-1}
      XA_CACHE_FRAME_WORKERS: ${XA_CACHE_FRAME_WORKERS:-1}
      XA_CACHE_CINE_WORKERS: ${XA_CACHE_CINE_WORKERS:-1}
      XA_CACHE_CINE_CRF: ${XA_CACHE_CINE_CRF:-23}
      XA_CACHE_BUILD_ARCHIVE: ${XA_CACHE_BUILD_ARCHIVE:-false}
      XA_CACHE_WARM_EXISTING: ${XA_CACHE_WARM_EXISTING:-false}
      XA_ARCHIVE_STUDY_WORKERS: ${XA_ARCHIVE_STUDY_WORKERS:-1}
      XA_ARCHIVE_DELETE_PACS: ${XA_ARCHIVE_DELETE_PACS:-false}
      XA_ARCHIVE_DELETE_LOCAL: ${XA_ARCHIVE_DELETE_LOCAL:-false}
      STUDY_RETENTION_ENABLED: ${STUDY_RETENTION_ENABLED:-false}
      REMOTE_PACS_URL: ${REMOTE_PACS_URL:-http://pacs:8042/instances}
      REMOTE_PACS_USERNAME: ${REMOTE_PACS_USERNAME:-mapdr}
      REMOTE_PACS_PASSWORD: ${REMOTE_PACS_PASSWORD}
      REMOTE_PACS_TIMEOUT_SECONDS: ${REMOTE_PACS_TIMEOUT_SECONDS:-300}
      REMOTE_PACS_IMPORT_WORKERS: ${REMOTE_PACS_IMPORT_WORKERS:-1}
      YANDEX_BUCKET: ${YANDEX_BUCKET:-agent-dicom}
      YANDEX_ENDPOINT: ${YANDEX_ENDPOINT:-https://storage.yandexcloud.net}
      YANDEX_REGION: ${YANDEX_REGION:-ru-central1}
      YANDEX_ACCESS_KEY_ID: ${YANDEX_ACCESS_KEY_ID:-}
      YANDEX_SECRET_ACCESS_KEY: ${YANDEX_SECRET_ACCESS_KEY:-}
    volumes:
      - reports-data:/app/reports
      - plans-data:/app/plans
      - xa-cache-data:/app/xa-cache
    ports:
      - ${ADMIN_BIND_ADDRESS:-127.0.0.1}:${BACKEND_ADMIN_PORT:-8080}:8080
    depends_on:
      migrations:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      pacs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      application:
        aliases: [viewer-backend]
      pacs: {}

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/repomz/viewer_frontend:0.2.34}
    environment:
      BACKEND_URL: http://backend:8080
      PACS_URL: http://pacs:8042
      PACS_AUTHORIZATION: ${PACS_AUTHORIZATION:?Set PACS_AUTHORIZATION in .env}
    ports:
      - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-80}:8080
      - ${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTPS_PORT:-443}:8443
    volumes:
      - ${VIEWER_TLS_DIR:-/opt/viewer/tls}:/etc/viewer-tls:ro
      - ${CERTBOT_WEBROOT:-/opt/viewer/certbot/www}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      pacs:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging: *default-logging
    networks: [application, pacs]

networks:
  application:
  pacs:

volumes:
  postgres-data:
  orthanc-data:
  reports-data:
  plans-data:
  xa-cache-data:
